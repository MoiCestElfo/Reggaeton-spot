<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reggaeton Spot</title>
<style>
:root{--bg:#14101f;--card:#211a36;--fg:#f4efff;--mut:#9a90b8;--acc:#ff4fa3;--ok:#3ddc97;--ko:#ff5c5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:20px}
main{width:100%;max-width:480px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);font-size:.9rem;margin-bottom:16px}
.stats{display:flex;gap:16px;color:var(--mut);font-size:.9rem;margin-bottom:16px}
.stats b{color:var(--fg)}
.steps{display:flex;gap:6px;margin-bottom:16px}
.step{flex:1;height:34px;border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--mut)}
.step.on{background:var(--acc);color:#fff;font-weight:700}
.step.used{background:#3a2f5c;color:var(--fg)}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--card);color:var(--fg)}
button.p{background:var(--acc);color:#fff;font-weight:700}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;margin-bottom:12px}
.row button{flex:1}
input{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--card);background:var(--card);color:var(--fg);outline:none}
input:focus{border-color:var(--acc)}
.sug{background:var(--card);border-radius:12px;margin-top:6px;max-height:220px;overflow:auto}
.sug div{padding:10px 12px;cursor:pointer;font-size:.9rem}
.sug div:hover{background:#2e2550}
.sug small{color:var(--mut)}
.msg{margin:14px 0;min-height:24px}
.ok{color:var(--ok)}.ko{color:var(--ko)}
.reveal{display:flex;gap:12px;align-items:center;background:var(--card);padding:12px;border-radius:12px;margin-top:10px}
.reveal img{width:64px;height:64px;border-radius:8px}
.hist{color:var(--mut);font-size:.85rem;margin-top:8px}
.era.on{background:var(--acc);color:#fff;font-weight:700}
.era{padding:8px 4px;font-size:.85rem;flex:1 1 28%}
#eras{flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <h1>🔥 Reggaeton Spot</h1>
  <div class="sub">Devine le morceau avec un extrait de plus en plus long.</div>
  <div class="row" id="eras"></div>
  <div class="stats">Score <b id="score">0</b> · Série <b id="streak">0</b> · Record <b id="best">0</b></div>
  <div class="steps" id="steps"></div>
  <div class="row">
    <button class="p" id="play">▶ Écouter</button>
    <button id="skip">Passer (+)</button>
    <button id="giveup">Abandonner</button>
  </div>
  <input id="guess" placeholder="Titre ou artiste…" autocomplete="off" disabled>
  <div class="sug" id="sug" hidden></div>
  <div class="msg" id="msg">Chargement des morceaux…</div>
  <div id="end"></div>
  <div class="hist" id="hist"></div>
  <button class="p" id="next" hidden style="width:100%;margin-top:12px">Morceau suivant →</button>
  <audio id="audio" preload="auto"></audio>
</main>
<script>
const ERAS={
"2000s":["Daddy Yankee","Don Omar","Wisin & Yandel","Tego Calderon","Ivy Queen","Hector El Father","Zion & Lennox","Tito El Bambino","Plan B","Arcangel","Baby Rasta & Gringo","Calle 13","Alexis & Fido","Jowell & Randy","Nicky Jam","Yandel","Wisin","Lennox","De La Ghetto","Trebol Clan","Julio Voltio","Gocho"],
"2010s":["Nicky Jam","J Balvin","Maluma","Ozuna","Farruko","Yandel","Wisin","Becky G","Natti Natasha","Nio Garcia","Casper Magico","Bad Bunny","Anuel AA","Daddy Yankee","De La Ghetto","Zion & Lennox","Arcangel","Nengo Flow","Brytiago","Darell","Bryant Myers","Almighty","Jhay Cortez","Sech","Justin Quiles","Lenny Tavarez","Chencho Corleone","Dalex","Karol G","Don Omar","Plan B","Gente de Zona","Reykon","Kevin Roldan"],
"2020s":["Bad Bunny","Rauw Alejandro","Feid","Karol G","Myke Towers","Jhay Cortez","Eladio Carrion","Mora","Sech","Lunay","Young Miko","Ryan Castro","Blessd","Manuel Turizo","Beele","Anuel AA","Ozuna","J Balvin","Becky G","Natti Natasha","Arcangel","Maluma","Rochy RD","Nicky Jam","Farruko","Dalex","Justin Quiles","Ovy On The Drums","Tainy"],
"Clásicos":["Joan Sebastian","Jose Jose","Vicente Fernandez","Pedro Infante","Juan Gabriel","Antonio Aguilar","Javier Solis","Jorge Negrete","Alejandro Fernandez","Los Tigres del Norte","Los Bukis","Marco Antonio Solis","Jose Alfredo Jimenez","Lola Beltran","Luis Miguel","Los Temerarios","Ramon Ayala","Chalino Sanchez","Selena","Los Angeles Azules","Pedro Fernandez","Cuco Sanchez","Los Panchos","Armando Manzanero","Lucha Villa"]
};
const artistEras=new Map();
Object.entries(ERAS).forEach(([e,l])=>l.forEach(a=>{if(!artistEras.has(a))artistEras.set(a,[]);artistEras.get(a).push(e)}));
const ARTISTS=[...artistEras.keys()];
let era='Tout';
const STEPS=[0.1,0.5,2,5,10,20];
const $=id=>document.getElementById(id);
const audio=$('audio');
let pool=[],cur=null,step=0,over=true,timer=null,score=0,streak=0,best=+localStorage.getItem('rgBest')||0,played=new Set();

function jsonp(url){return new Promise((res,rej)=>{
  const cb='cb'+Math.random().toString(36).slice(2);
  const s=document.createElement('script');
  const t=setTimeout(()=>{s.remove();rej()},10000);
  window[cb]=d=>{clearTimeout(t);delete window[cb];s.remove();res(d)};
  s.onerror=()=>{clearTimeout(t);rej()};
  s.src=url+'&output=jsonp&callback='+cb;
  document.body.appendChild(s);
})}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\(.*?\)|\[.*?\]|- .*$/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();

let started=false,waiting=false;
const inEra=x=>era==='Tout'?x.eras.some(e=>e!=='Clásicos'):x.eras.includes(era);
async function load(){
  const byKey=new Map();let ok=0;
  const match=(a,name)=>{const ea=artistEras.get(a);return ea.length===1&&ea[0]==='Clásicos'?norm(name||'')===norm(a):(' '+norm(name||'')+' ').includes(' '+norm(a)+' ')};
  const add=(id,title,artist,preview,cover,eras)=>{
    if(!preview)return;
    const key=norm(title)+'|'+norm(artist);
    const ex=byKey.get(key);
    if(ex){eras.forEach(e=>{if(!ex.eras.includes(e))ex.eras.push(e)});return}
    const t={id,title,artist,key:norm(title),preview,cover,eras:[...eras]};
    byKey.set(key,t);pool.push(t);
    if(waiting&&inEra(t)){newRound();return}
    if(!started&&pool.length>=20){started=true;newRound()}
  };
  const jobs=ARTISTS.map((a,i)=>new Promise(r=>setTimeout(r,i*130)).then(()=>
    jsonp(`https://api.deezer.com/search/track?q=${encodeURIComponent(a)}&limit=100`)
    .then(d=>{ok++;(d.data||[]).filter(t=>match(a,t.artist.name)&&!/\b(remix|mix|version|live|karaoke|instrumental|acoustic|en vivo)\b/i.test(t.title)).sort((x,y)=>(y.rank||0)-(x.rank||0)).slice(0,25).forEach(t=>{add('d'+t.id,t.title,t.artist.name,t.preview,t.album&&t.album.cover_medium,artistEras.get(a))})})));
  await Promise.allSettled(jobs);
  if(pool.length<20){$('msg').textContent=`Impossible de charger les morceaux (${ok}/${ARTISTS.length} requêtes réussies).`;return}
  if(waiting)newRound();
}

function drawSteps(){
  $('steps').innerHTML=STEPS.map((s,i)=>`<div class="step ${i===step&&!over?'on':i<step?'used':''}">${s}s</div>`).join('');
}
function newRound(){
  const list=pool.filter(inEra);
  if(!list.length){waiting=true;over=true;stopAll();['play','skip','giveup','guess'].forEach(i=>$(i).disabled=true);$('end').innerHTML='';$('next').hidden=true;$('msg').textContent='Chargement de cette catégorie…';return}
  waiting=false;
  if(list.every(x=>played.has(x.id)))list.forEach(x=>played.delete(x.id));
  let t;do{t=list[Math.floor(Math.random()*list.length)]}while(played.has(t.id));
  played.add(t.id);cur=t;step=0;over=false;
  audio.src=t.preview;audio.load();stopAll();prepare(t);
  $('end').innerHTML='';$('hist').textContent='';$('msg').textContent='';$('next').hidden=true;
  $('guess').value='';$('guess').disabled=false;$('skip').disabled=false;$('giveup').disabled=false;$('play').disabled=false;
  drawSteps();updateStats();
}
function updateStats(){$('score').textContent=score;$('streak').textContent=streak;$('best').textContent=best}
let ctx=null,src=null,tok=0;
function stopAll(){
  clearTimeout(timer);tok++;
  if(src){try{src.stop()}catch(e){}src=null}
  audio.pause();
}
async function prepare(t){
  if(!ctx||t.buf||t.failed||t.loading)return;
  t.loading=true;
  try{
    const ab=await (await fetch(t.preview)).arrayBuffer();
    const b=await new Promise((res,rej)=>ctx.decodeAudioData(ab,res,rej));
    const d=b.getChannelData(0);let i=0;
    while(i<d.length&&Math.abs(d[i])<0.02)i++;
    t.onset=Math.min(2,Math.max(0,i/b.sampleRate-0.01));t.buf=b;
  }catch(e){t.failed=true}
  t.loading=false;
}
function fbPlay(sec){
  audio.currentTime=0;
  audio.addEventListener('playing',()=>{timer=setTimeout(()=>audio.pause(),sec*1000)},{once:true});
  audio.play().catch(()=>{});
}
async function playSec(sec){
  stopAll();const my=tok;
  if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)ctx=new AC()}
  if(ctx&&ctx.state==='suspended')ctx.resume();
  if(ctx&&!cur.buf&&!cur.failed){$('msg').textContent='Chargement…';while(cur.loading)await new Promise(r=>setTimeout(r,50));await prepare(cur);$('msg').textContent=''}
  if(my!==tok)return;
  if(cur.buf){
    src=ctx.createBufferSource();src.buffer=cur.buf;src.connect(ctx.destination);
    src.start(0,cur.onset,sec);
  }else fbPlay(sec);
}
function playClip(){playSec(STEPS[step])}
function playClipOld(){
}
function finish(win){
  over=true;stopAll();
  if(win){const pts=STEPS.length-step;score+=pts;streak++;if(streak>best){best=streak;localStorage.setItem('rgBest',best)}
    $('msg').innerHTML=`<span class="ok">Bravo ! +${pts} pt${pts>1?'s':''}</span>`}
  else{streak=0;$('msg').innerHTML='<span class="ko">Raté…</span>'}
  $('end').innerHTML=`<div class="reveal"><img src="${cur.cover||''}" alt=""><div><b>${cur.title}</b><br>${cur.artist}</div></div>`;
  $('guess').disabled=true;$('skip').disabled=true;$('giveup').disabled=true;$('sug').hidden=true;
  $('next').hidden=false;drawSteps();updateStats();
  playSec(30);
}
function wrong(txt){
  $('hist').textContent=(txt?'❌ '+txt:'⏭ Passé');
  if(step>=STEPS.length-1){finish(false);return}
  step++;drawSteps();playClip();
}
function submit(t){
  if(over)return;
  const ok=t.id===cur.id||(t.key===cur.key&&norm(t.artist)===norm(cur.artist));
  $('guess').value='';$('sug').hidden=true;
  ok?finish(true):wrong(t.title+' – '+t.artist);
}
$('guess').addEventListener('input',e=>{
  const q=norm(e.target.value);
  if(q.length<2){$('sug').hidden=true;return}
  const m=pool.filter(t=>(norm(t.title)+' '+norm(t.artist)).includes(q)).slice(0,8);
  $('sug').innerHTML='';
  m.forEach(t=>{const d=document.createElement('div');d.innerHTML=`${t.title} <small>– ${t.artist}</small>`;d.onclick=()=>submit(t);$('sug').appendChild(d)});
  $('sug').hidden=!m.length;
});
$('play').onclick=()=>{if(!over)playClip()};
$('skip').onclick=()=>wrong('');
$('giveup').onclick=()=>{if(!over)finish(false)};
$('next').onclick=()=>{newRound();playClip()};
function drawEras(){
  $('eras').innerHTML='';
  ['Tout','2000s','2010s','2020s','Clásicos'].forEach(e=>{
    const b=document.createElement('button');b.textContent=e==='Clásicos'?'🇲🇽 Clásicos':e;b.className='era'+(e===era?' on':'');
    b.onclick=()=>{era=e;drawEras();if(pool.length>=20){stopAll();newRound()}};
    $('eras').appendChild(b);
  });
}
drawEras();drawSteps();updateStats();
$('play').disabled=true;$('skip').disabled=true;$('giveup').disabled=true;
load();
</script>
</body>
</html>
